<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>刷题 · 医路研途</title><link rel="stylesheet" href="theme.css?v=20261015"></head><body>
<main class="app-main"><div class="content"><header class="masthead" id="masthead"></header><div class="quiz-shell" id="quiz-content"><header class="quiz-top"><button class="btn btn-ghost" id="btn-exit">保存退出</button><h1 id="quiz-title">专项练习</h1><span class="timer" id="timer">00:00:00</span></header><div class="quiz-progress"><i id="quiz-prog"></i></div><div class="quiz-tools"><div class="mode-tabs" id="quiz-modes"><button data-quiz-mode="practice">练习</button><button data-quiz-mode="self">背题自评</button></div><span class="badge" id="exam-tag" hidden>模考进行中</span><div class="tools-end"><button class="btn btn-ghost btn-small" id="btn-sheet">答题卡</button><button class="btn btn-small" id="btn-submit-exam" hidden>交卷</button></div></div>
<div class="notice" id="learning-save-warning" role="status" hidden><span id="learning-save-status"></span><div class="form-actions"><button class="text-btn" id="retry-learning-save">重试保存</button><button class="text-btn" id="download-learning-session">下载本轮备份</button></div></div>
<section class="card qcard" id="question-card"><div class="row-between"><div class="q-meta"><span class="tag" id="subject-tag"></span><span class="tag" id="type-tag"></span><span class="tag" id="orig-tag"></span><span class="badge warn" id="pending-tag" hidden>答案待核对</span></div><span class="muted" id="question-number" style="font-size:12px;white-space:nowrap;margin-bottom:20px"></span></div><div class="stem" id="stem"></div><div id="options"></div><div class="row-between" style="margin-top:16px"><button class="text-btn" id="btn-flag">标记疑问</button><button class="text-btn" id="btn-feedback">反馈这道题</button></div>
<section class="explanation" id="explanation" hidden><div class="verdict" id="verdict"></div><p class="muted" id="source-note" style="font-size:11px"></p><details class="exp-block" open><summary>解析与原理</summary><div class="exp-body" id="explain-text"></div></details><details class="exp-block"><summary>考点定位</summary><div class="exp-body" id="point-text"></div></details><details class="exp-block" id="extend-details" hidden><summary>以题带点 · 延伸与易混点</summary><div class="exp-body" id="extend-text"></div></details><details class="exp-block" id="knowledge-details" hidden><summary id="knowledge-title">知识点卡片</summary><div class="exp-body" id="knowledge-text"></div></details><details class="exp-block"><summary>我的笔记 · 自动保存</summary><div class="exp-body"><textarea id="q-note" aria-label="本题笔记" placeholder="记录易混点、记忆方法与自己的理解…"></textarea></div></details><div class="related-row"><button class="btn btn-ghost btn-small" id="related-btn" hidden>练习同考点题</button><a class="btn btn-ghost btn-small" href="knowledge.html">查阅知识手册</a></div></section>
<div class="self-actions" id="self-actions" hidden><button class="btn btn-ok" id="self-right">记得 · 我答对了</button><button class="btn btn-no" id="self-wrong">需要复习 · 我答错了</button></div><div class="quiz-actions"><button class="btn btn-ghost" id="btn-prev">上一题</button><button class="text-btn" id="btn-skip">跳过</button><button class="btn btn-primary" id="btn-main">下一题</button></div><button class="text-btn" id="back-result" hidden style="margin-top:15px">返回本轮报告</button></section><p class="quiz-hint" id="quiz-hint"></p>
<section id="result-content" hidden><div class="result-hero"><div class="eyebrow" id="report-kicker">学习复盘</div><div class="score"><span id="report-score">0</span><small id="report-total"></small></div><p id="report-desc"></p><div class="result-grid"><div><b id="report-right">0</b>答对题数</div><div><b id="report-wrong">0</b>答错题数</div><div><b id="report-unanswered">0</b>可判定题未答</div><div><b id="report-time">0</b>本轮用时</div></div><div class="notice" id="report-pending" hidden></div><p id="report-paper-notice" class="muted" style="font-size:11px" hidden></p></div><div class="section-head"><h2>找到下一步的学习重点</h2><a href="stats.html">学习报告 →</a></div><div class="card" id="report-subjects"></div><div class="form-actions"><button class="btn" id="report-review-btn">逐题复盘与解析</button><button class="btn btn-ghost" id="report-wrong-btn">再练本轮错题</button><button class="btn btn-ghost" id="report-export">导出错题 Anki</button><a class="btn btn-ghost" href="tiku.html">返回题库</a></div></section></div></div></main>
<script src="questions.js?v=20261014"></script><script src="knowledge.js?v=20261014"></script><script src="question-updates.js?v=20261018"></script><script src="chapters.js?v=20261014"></script><script src="app-core.js?v=20261014"></script><script src="ui.js?v=20261014"></script><script src="quiz.js?v=20261018"></script><script src="interact.js?v=20261014"></script></body></html>
