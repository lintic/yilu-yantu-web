<main class="app-main"><div class="content"><header class="masthead" id="masthead"></header><div class="page-heading"><div><div class="eyebrow">QUESTION BANK</div><h1 id="page-heading-title" style="margin-top:7px">从一道题，学会一个考点</h1><p id="bank-desc">按科目练习、查看解析，再做同类题验证理解。</p></div><div class="heading-side">题库持续完善<b>2016—2025 核心真题</b></div></div>

<div class="bank-settings-body"><p class="muted" id="settings-note">选择范围、题数与顺序，设置会自动记住。</p><div class="bank-settings-grid"><div class="filter-item"><label for="set">题目来源</label><select id="set"></select></div><div class="filter-item"><label for="subject">科目</label><select id="subject"></select></div><div class="filter-item"><label for="year">年份</label><select id="year"></select></div><div class="filter-item"><label for="count">每组题数</label><select id="count"><option value="10">10 题</option><option value="20" selected>20 题</option><option value="50">50 题</option><option value="all">当前范围全部</option></select></div><div class="filter-item"><label for="order">题目顺序</label><select id="order" aria-describedby="order-hint"><option value="seq">按原题顺序</option><option value="random">随机抽题</option></select><small id="order-hint">顺序：年份从新到旧，同年按题号。年度模考与按卷练习固定原卷顺序。</small></div></div><p class="muted settings-answer-note">答案待核对的题继续保留，模考结算会单独标记。</p></div>

nation" id="pagination"><button class="btn btn-ghost btn-small" id="page-prev">上一页</button><span id="page-no"></span><button class="btn btn-ghost btn-small" id="page-next">下一页</button></div></section></div></div></main>
