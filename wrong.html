<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>错题复习 · 医路研途</title><link rel="stylesheet" href="theme.css?v=20261015"></head><body>
<main class="app-main"><div class="content"><header class="masthead" id="masthead"></header><div class="page-heading"><div><div class="eyebrow">REVIEW & RETENTION</div><h1 id="title" style="margin-top:7px">错题复习</h1><p>同考点错题一起复习，把反复出错的地方学清楚。</p></div></div>

<div class="legacy-page">

  

  <div class="seg">

    <button class="on" id="seg-due">到期考点</button>

    <button id="seg-all">全部错题</button>

  </div>

  <div id="list"></div>

  <div class="btn-row" id="actions" style="display:none">

    <button class="btn btn-p" id="btn-review">一键回炉全部到期</button>

    <button class="btn btn-g" id="btn-export">导出 Anki</button>

  </div>

  <div class="tip-line" id="tipline" hidden></div>



  <details class="settings"><summary>调整复习节奏</summary>

    

    <p>自适应规则：答对进下一轮（<span id="st-show"></span> 天），连续答对 3 次跳一级，最后一轮答对后移出复习队列；答错回第 1 轮。下面可改成自己的节奏（天数用逗号分隔）。</p>

    <div class="row">

      <input id="st-input" aria-label="复习间隔（天）" inputmode="numeric" placeholder="如：1,3,7,15,30">

      <button class="btn-sm sv" id="st-save">保存</button>

      <button class="btn-sm rst" id="st-reset">恢复默认</button>

    </div>

    <div class="msg" id="st-msg"></div>

  </details>

</div>







</div></main>
<script src="questions.js?v=20261014"></script><script src="question-updates.js?v=20261018"></script><script src="chapters.js?v=20261014"></script><script src="app-core.js?v=20261014"></script><script src="ui.js?v=20261014"></script><script src="wrong-page.js"></script><script src="interact.js?v=20261014"></script></body></html>
